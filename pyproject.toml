[build-system]
requires = ["setuptools>=77.0.3,<90", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kario-pit-audit-core"
version = "0.9.0.dev2"
description = "Vendor-neutral, local-first PIT audit research infrastructure (pre-release; no certification)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "asn1crypto==1.5.1",
  "cryptography==50.0.2",
]

[project.scripts]
kario-pit = "kario_pit.cli_v09:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kario_pit*"]
